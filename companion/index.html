<!-- Phone UI fragment. build.py wraps this in the Mira package (manifest + WASM). -->
<style>
  :root { color-scheme: light dark; }
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { opacity: .7; font-size: 13px; }
  video, #shot { width: 100%; border-radius: 12px; background: #000; margin: 8px 0; }
  #shot:not([src]) { display: none; }
  button { font: inherit; padding: 14px; width: 100%; border-radius: 12px; border: 0;
           background: #e3350d; color: #fff; font-weight: 600; margin: 8px 0; }
  button:disabled { opacity: .5; }
  #status { font-size: 13px; }
  label { display: block; font-size: 13px; margin-top: 12px; }
  input, select { font: inherit; width: 100%; box-sizing: border-box; padding: 10px;
                  border-radius: 8px; border: 1px solid #8884; margin-top: 4px; }
  details { margin-top: 16px; }
  label.check { display: flex; gap: 10px; align-items: center; }
  label.check input { width: auto; margin: 0; }
  #log { font: 12px ui-monospace, monospace; padding-left: 16px; }
  #chat { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: #e3350d; color: #fff; }
  .msg.bot { align-self: flex-start; background: #8883; font-size: 17px; }
  #askform { display: flex; gap: 8px; align-items: center; }
  #askform input { margin: 0; }
  #askform button { width: auto; margin: 0; padding: 10px 16px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chip { width: auto; margin: 0; padding: 8px 12px; font-size: 14px; font-weight: 500;
          background: #8883; color: inherit; }
</style>
<main id="mira-companion-root">
  <h1>Pokedex</h1>
  <div class="muted">Claude model: <span id="model"></span></div>

  <video id="preview" autoplay playsinline muted></video>
  <button id="scan">Scan</button>
  <div id="status" class="muted">Starting...</div>
  <img id="shot" alt="Last frame sent to Claude">
  <div id="chat"></div>

  <form id="askform">
    <input id="question" type="text" enterkeyhint="send" autocomplete="off"
           placeholder="Ask about the photo...">
    <button id="askbtn" type="submit">Ask</button>
  </form>
  <div class="chips">
    <button class="chip" type="button" data-q="READ">What does it say?</button>
    <button class="chip" type="button" data-q="Tell me more about it.">Tell me more</button>
    <button class="chip" type="button" data-q="What is it worth, roughly?">Worth?</button>
  </div>
  <div id="voicehelp" class="muted"></div>

  <details id="settings">
    <summary>Settings</summary>
    <label>Anthropic API key (saved on this phone only)
      <input id="key" type="password" autocomplete="off" placeholder="sk-ant-...">
    </label>
    <label class="check"><input id="convo" type="checkbox" checked>
      Conversation mode: after each answer, listen 10 s for a follow-up question
    </label>
    <label>Camera source
      <select id="source">
        <option value="phone">Phone camera (live)</option>
        <option value="picker">Phone photo picker</option>
        <option value="url">Camera URL (v2 / external cam)</option>
      </select>
    </label>
    <label>Camera URL (for "Camera URL" source)
      <input id="camurl" type="url" placeholder="http://192.168.1.50/capture">
    </label>
  </details>

  <details>
    <summary>Log</summary>
    <ul id="log"></ul>
  </details>
</main>
